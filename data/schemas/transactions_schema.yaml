# ============================================================
# Schema: TRANSACTIONS
# Owner: Data Engineering Team
# Last updated: 2026-04-07
# Source system: Payment Gateway (Stripe)
# Destination: DW.TRANSACTIONS (Snowflake)
# Update frequency: Every 15 minutes via micro-batch
# ============================================================

table: TRANSACTIONS
database: DW
schema: PUBLIC
description: >
  Fact table recording every customer purchase event. Sourced from the
  Stripe payment gateway webhook log. Append-only – records are never
  updated or deleted after landing (immutable audit log). Refunds are
  represented as separate rows with a negative amount.

columns:
  - name: transaction_id
    type: VARCHAR(20)
    nullable: false
    primary_key: true
    description: >
      Surrogate key generated by the ETL pipeline (UUID v4 prefix trimmed to
      20 chars). Immutable after creation.

  - name: customer_id
    type: VARCHAR(10)
    nullable: false
    foreign_key: CUSTOMERS.customer_id
    description: >
      Foreign key to DW.CUSTOMERS. Must exist in CUSTOMERS at load time.
      Orphan transactions (no matching customer) are written to
      DW.TXN_ORPHAN_LOG and excluded from the main table.

  - name: product_id
    type: VARCHAR(20)
    nullable: false
    description: >
      Product identifier from the product catalogue. Validated against
      DW.PRODUCT_LOOKUP; unknown product_ids are quarantined.

  - name: amount
    type: DECIMAL(12,2)
    nullable: false
    description: >
      Transaction amount in USD. Negative values indicate refunds.
      Valid range: -999999.99 to 999999.99. Zero-amount records are
      rejected (Stripe does not emit zero-value events).

  - name: currency
    type: VARCHAR(3)
    nullable: false
    description: >
      ISO 4217 currency code (e.g. USD, EUR, GBP). All non-USD transactions
      are converted to USD using the exchange rate at transaction_date
      stored in DW.FX_RATES before loading.

  - name: transaction_date
    type: DATE
    nullable: false
    description: >
      Calendar date of the transaction (UTC). Derived from transaction_ts.
      Used as the partition key in Snowflake for time-travel queries.

  - name: transaction_ts
    type: TIMESTAMP_TZ
    nullable: false
    description: >
      Full UTC timestamp of the payment event from Stripe. Stored with
      timezone (TZ suffix). The ETL does not adjust timezone – all Stripe
      events are emitted in UTC.

  - name: status
    type: VARCHAR(20)
    nullable: false
    description: >
      Payment status from Stripe. Allowed values: completed, pending,
      failed, refunded. Records with status=failed are loaded but flagged
      for the Finance team's daily exception report.

  - name: channel
    type: VARCHAR(30)
    nullable: true
    description: >
      Sales channel (e.g. web, mobile_ios, mobile_android, in_store).
      NULL for legacy records before channel tracking was introduced (2022).

  - name: etl_load_ts
    type: TIMESTAMP
    nullable: false
    description: ETL pipeline write timestamp. Used for incremental audits.

  - name: etl_batch_id
    type: VARCHAR(36)
    nullable: false
    description: UUID of the ETL batch run that loaded this record. Enables batch-level rollback.

quality_rules:
  - rule: no_null_transaction_id
    description: transaction_id must never be NULL.
    enforced_by: "%assert_no_nulls(TRANSACTIONS, transaction_id)"

  - rule: no_null_customer_id
    description: customer_id must never be NULL.
    enforced_by: "%assert_no_nulls(TRANSACTIONS, customer_id)"

  - rule: valid_amount
    description: amount must not be zero; range -999999.99 to 999999.99.
    enforced_by: "ETLPipeline._validate() range check"

  - rule: referential_integrity_customer
    description: customer_id must exist in DW.CUSTOMERS.
    enforced_by: "ETL merge step; orphans to DW.TXN_ORPHAN_LOG"

  - rule: valid_status_values
    description: status must be one of completed, pending, failed, refunded.
    enforced_by: "ETLPipeline._validate() category check"

  - rule: no_future_transaction_date
    description: transaction_date must be <= today.
    enforced_by: "SAS DATA step date validation in etl_transactions.sas"

lineage:
  source_system: Stripe Payment Gateway (webhook events)
  extract_method: Stripe Events API, filtered by type=charge.succeeded/failed/refunded
  transform_steps:
    - Parse Stripe JSON payload into tabular format
    - Convert amount from cents (Stripe) to dollars (divide by 100)
    - Convert non-USD amounts using DW.FX_RATES
    - Derive transaction_date from transaction_ts (UTC floor to day)
    - Validate referential integrity against CUSTOMERS and PRODUCT_LOOKUP
    - Assign etl_batch_id (UUID) for batch traceability
  load_method: Append-only INSERT (no updates/deletes)
  load_script: etl/python/pipeline.py
  sas_script: etl/sas/etl_transactions.sas
